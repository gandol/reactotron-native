name: Reactotron
options:
  bundleIdPrefix: com.reactotron
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
targets:
  Reactotron:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
      - path: Sources/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reactotron.native
        # Bundle filename → "Reactotron Native.app" so it never collides with
        # the official Electron "Reactotron.app" in /Applications (they also
        # differ by bundle id: com.reactotron.native vs com.reactotron). The
        # Xcode target and scheme stay named "Reactotron", so build commands
        # are unaffected.
        PRODUCT_NAME: "Reactotron Native"
        # Keep the Swift MODULE name "Reactotron" (no space) so `@testable
        # import Reactotron` in the tests still resolves — otherwise PRODUCT_NAME
        # would derive a "Reactotron_Native" module and break every test file.
        PRODUCT_MODULE_NAME: Reactotron
        GENERATE_INFOPLIST_FILE: YES
        # Full display name in the Dock, Finder, menu bar, and Cmd-Tab switcher.
        INFOPLIST_KEY_CFBundleDisplayName: "Reactotron macOS Native"
        # App icon (Dock/Finder/Cmd-Tab) from the AppIcon set in
        # Sources/Resources/Assets.xcassets, generated from the Reactotron logo.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Matches apps/reactotron-app/package.json's "version" at the time of
        # this port (Task 14) — HelpPage's "Using Reactotron {version}" title
        # reads this via CFBundleShortVersionString, same as the source reads
        # projectJson.version. Without an explicit value, GENERATE_INFOPLIST_FILE
        # falls back to Xcode's unhelpful default.
        MARKETING_VERSION: "3.11.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  ReactotronTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST/BUNDLE_LOADER from the app TARGET name
        # ("Reactotron"), but the app's PRODUCT_NAME is now "Reactotron Native",
        # so the auto-derived paths point at a non-existent Reactotron.app.
        # Point them at the real product explicitly.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Reactotron Native.app/Contents/MacOS/Reactotron Native"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Reactotron
schemes:
  Reactotron:
    build:
      targets:
        Reactotron: all
    test:
      targets:
        - ReactotronTests
