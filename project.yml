name: Reactotron
options:
  bundleIdPrefix: com.reactotron
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
targets:
  Reactotron:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
      - path: Sources/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reactotron.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Matches apps/reactotron-app/package.json's "version" at the time of
        # this port (Task 14) — HelpPage's "Using Reactotron {version}" title
        # reads this via CFBundleShortVersionString, same as the source reads
        # projectJson.version. Without an explicit value, GENERATE_INFOPLIST_FILE
        # falls back to Xcode's unhelpful default.
        MARKETING_VERSION: "3.11.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  ReactotronTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Reactotron
schemes:
  Reactotron:
    build:
      targets:
        Reactotron: all
    test:
      targets:
        - ReactotronTests
