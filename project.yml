name: Reactotron
options:
  bundleIdPrefix: com.reactotron
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
targets:
  Reactotron:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
      - path: Sources/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reactotron.native
        GENERATE_INFOPLIST_FILE: YES
        # Display name shown in the Dock, Finder, and Cmd-Tab switcher. Kept
        # separate from the target/binary name (Reactotron) so build/scheme
        # commands, the test host, and DerivedData paths stay unchanged.
        # (CFBundleName / the menu-bar title stays "Reactotron" because Xcode
        # locks it to PRODUCT_NAME; changing that would rename the .app and
        # break the ReactotronTests test host.)
        INFOPLIST_KEY_CFBundleDisplayName: "Reactotron macOS Native"
        # App icon (Dock/Finder/Cmd-Tab) from the AppIcon set in
        # Sources/Resources/Assets.xcassets, generated from the Reactotron logo.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Matches apps/reactotron-app/package.json's "version" at the time of
        # this port (Task 14) — HelpPage's "Using Reactotron {version}" title
        # reads this via CFBundleShortVersionString, same as the source reads
        # projectJson.version. Without an explicit value, GENERATE_INFOPLIST_FILE
        # falls back to Xcode's unhelpful default.
        MARKETING_VERSION: "3.11.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  ReactotronTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Reactotron
schemes:
  Reactotron:
    build:
      targets:
        Reactotron: all
    test:
      targets:
        - ReactotronTests
